# Local development database. Connection string: api/src/AcroFunJam.Api/appsettings.Development.json
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acrofunjam
      POSTGRES_USER: acrofunjam
      POSTGRES_PASSWORD: acrofunjam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acrofunjam -d acrofunjam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
