# Local development database. Connection string: api/src/AcroFunJam.Api/appsettings.Development.json
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acrofunjam
      POSTGRES_USER: acrofunjam
      POSTGRES_PASSWORD: acrofunjam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acrofunjam -d acrofunjam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage compatible with S3 for the photos of the poses (ADR 0039). RustFS: MinIO no longer publishes its images.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: acrofunjam
      RUSTFS_SECRET_KEY: acrofunjam-secret
    ports:
      - "9000:9000"
    volumes:
      - photos-data:/data

volumes:
  postgres-data:
  photos-data:
