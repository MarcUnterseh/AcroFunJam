name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + tests, integration included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build api/AcroFunJam.slnx
      - name: Test (unit, architecture, specs @api, integration via Testcontainers)
        # Docker is available on ubuntu-latest: Testcontainers starts PostgreSQL itself.
        run: dotnet test --solution api/AcroFunJam.slnx --no-build

  front:
    name: Front (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e-web:
    name: E2E web (playwright-bdd)
    runs-on: ubuntu-latest
    needs: front
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: front/apps/web
      - run: npm run e2e
        working-directory: front/apps/web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/apps/web/playwright-report
          retention-days: 7
