name: Deploy

# Continuous deployment to the server (ADR 0040): after a successful CI on main, or by hand to deploy a given commit
# again (going back to a previous version).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit (full SHA) to deploy; empty for the last commit of main
        required: false

# One deployment at a time, never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Images (API, migrations, website)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.sha }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/acrofunjam-api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Migrations
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          target: migrations
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/acrofunjam-migrations:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
      - name: Website
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/acrofunjam-web:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Production
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      TAG: ${{ needs.images.outputs.tag }}
      SSH: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.tag }}
          sparse-checkout: deploy
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the configuration
        run: scp deploy/compose.yml deploy/backup.sh "$SSH:/opt/acrofunjam/"
      - name: Migrate, then start the new version
        # The script goes through stdin: the token never appears on a command line of the server.
        run: |
          ssh "$SSH" sh -s <<EOF
          set -eu
          cd /opt/acrofunjam
          chmod +x backup.sh
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env
          docker compose pull --quiet
          docker compose run --rm migrate
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -af --filter "until=168h"
          EOF
      - name: Check that the site answers
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DOMAIN }}/health" > /dev/null; then echo "Version $TAG online"; exit 0; fi
            sleep 5
          done
          echo "::error::https://${{ vars.DOMAIN }}/health does not answer"; exit 1
