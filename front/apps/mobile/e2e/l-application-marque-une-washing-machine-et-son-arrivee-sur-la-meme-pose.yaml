# L'application marque une washing machine et son arrivée sur la même pose
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- scrollUntilVisible:
    element:
      text: 'Étape 1 · Ninja Star'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'washing machine'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '(même pose)'
    direction: DOWN
    timeout: 15000
