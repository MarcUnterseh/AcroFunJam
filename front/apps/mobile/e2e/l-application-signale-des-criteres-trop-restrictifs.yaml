# L'application signale des critères trop restrictifs
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Débutant'
    index: 0
- tapOn:
    text: 'Débutant'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Critères trop restrictifs : impossible de générer un flow.'
    timeout: 15000
