# Dans l'application, un visiteur obtient un flow en réessayant quand AcroFunJam est de nouveau joignable
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- setAirplaneMode: enabled
- tapOn: 'Diminuer le nombre de transitions'
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Impossible de générer le flow. Vérifie ta connexion Internet, puis réessaie.'
    timeout: 15000
- setAirplaneMode: disabled
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Throne'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étape 1 · de Throne vers Bird'
    direction: DOWN
    timeout: 15000
