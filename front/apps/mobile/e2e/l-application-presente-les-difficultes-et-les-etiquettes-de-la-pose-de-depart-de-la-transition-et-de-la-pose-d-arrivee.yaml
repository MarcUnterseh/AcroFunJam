# L'application présente les difficultés et les étiquettes de la pose de départ, de la transition et de la pose d'arrivée
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Bird'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étape 1 · de Bird vers Folded Leaf'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Folded Leaf'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étiquettes : lunaire'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étiquettes : inversion, lunaire'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Intermédiaire'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Découverte'
    direction: DOWN
    timeout: 15000
