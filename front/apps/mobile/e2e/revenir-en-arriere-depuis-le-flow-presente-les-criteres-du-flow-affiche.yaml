# Revenir en arrière depuis le flow présente les critères du flow affiché
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Débutant'
    index: 0
- tapOn:
    text: 'Intermédiaire'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Ton flow'
    timeout: 15000
- back
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '2'
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: 'Intermédiaire'
    checked: true
