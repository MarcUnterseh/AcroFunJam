# L'application présente le flow en étapes numérotées depuis sa pose de départ
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Throne'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étape 1 · Pop to Bird'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Étape 2 · de Bird vers Folded Leaf'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Folded Leaf'
    direction: DOWN
    timeout: 15000
