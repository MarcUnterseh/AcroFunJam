# Dans l'application, un visiteur déplie la description de la transition d'une étape
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- scrollUntilVisible:
    element:
      text: 'Description'
    direction: DOWN
    timeout: 15000
- tapOn: 'Description'
- scrollUntilVisible:
    element:
      text: 'La base propulse le flyer depuis Throne, puis le rattrape en Bird.'
    direction: DOWN
    timeout: 15000
