# Un visiteur qui rouvre l'application retrouve le flow affiché
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Avancé'
    index: 0
- tapOn:
    text: 'Avancé'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- extendedWaitUntil:
    visible: 'Ton flow'
    timeout: 15000
- repeat:
    times: 15
    while:
      notVisible: '1 transition, de Throne à Bird.'
    commands:
      - tapOn:
          id: 'generer-un-autre-flow'
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Ton flow'
    timeout: 45000
- extendedWaitUntil:
    visible: '1 transition, de Throne à Bird.'
    timeout: 15000
