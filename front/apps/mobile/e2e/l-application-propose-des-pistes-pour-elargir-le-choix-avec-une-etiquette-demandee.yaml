# L'application propose des pistes pour élargir le choix, avec une étiquette demandée
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Débutant'
    index: 0
- tapOn:
    text: 'Débutant'
    index: 1
- tapOn: 'Étiquettes \(facultatives\).*'
- scrollUntilVisible:
    element:
      text: 'lunaire'
      index: 0
    direction: DOWN
    timeout: 10000
- tapOn:
    text: 'lunaire'
    index: 0
- tapOn:
    id: 'generer-un-flow'
- scrollUntilVisible:
    element:
      text: '• moins de transitions ;'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '• plus d''étiquettes demandées, ou aucune.'
    direction: DOWN
    timeout: 15000
