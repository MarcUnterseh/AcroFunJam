# L'application propose des pistes pour élargir le choix, sans critère d'étiquette
appId: com.acrofunjam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Nombre de transitions'
    timeout: 30000
- tapOn: 'Diminuer le nombre de transitions'
- tapOn:
    text: 'Débutant'
    index: 0
- tapOn:
    text: 'Débutant'
    index: 1
- tapOn:
    id: 'generer-un-flow'
- scrollUntilVisible:
    element:
      text: '• moins de transitions ;'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '• des plafonds de difficulté plus hauts.'
    direction: DOWN
    timeout: 15000
