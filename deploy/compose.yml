# Production on one server (ADR 0040). Copied to the server by .github/workflows/deploy.yml, next to the .env file
# (model: deploy/.env.example). IMAGE_TAG is the commit deployed.
#   docker compose run --rm migrate && docker compose up -d
name: acrofunjam

# Logs go to the journal of the server, which keeps them 14 days at most, as the privacy policy says: they may hold
# IP addresses. The retention is set on the server (docs/deploiement.md, MaxRetentionSec=14day).
x-logging: &logging
  driver: journald
  options:
    tag: "acrofunjam-{{.Name}}"

services:
  web:
    image: ghcr.io/${IMAGE_OWNER}/acrofunjam-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${DOMAIN}
    volumes:
      - caddy-data:/data # certificates
      - caddy-config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/${IMAGE_OWNER}/acrofunjam-api:${IMAGE_TAG}
    logging: *logging
    restart: unless-stopped
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true" # behind Caddy, the only service that reaches it
      ConnectionStrings__AcroFunJam: Host=postgres;Database=acrofunjam;Username=acrofunjam;Password=${POSTGRES_PASSWORD}
      PhotoStorage__ServiceUrl: ${PHOTO_STORAGE_URL}
      PhotoStorage__Bucket: ${PHOTO_STORAGE_BUCKET}
      PhotoStorage__AccessKey: ${PHOTO_STORAGE_ACCESS_KEY}
      PhotoStorage__SecretKey: ${PHOTO_STORAGE_SECRET_KEY}
      PhotoStorage__CreateBucket: "false" # created with the storage; the key may only write in it
      Identity__InitialAdministratorEmail: ${INITIAL_ADMINISTRATOR_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # The preparation of the videos (ADR 0041): one core and 1 GB at most, so that the API and PostgreSQL keep the other core;
  # ffmpeg runs in it at a lower priority, with 2 threads. No published port. When it stops (a deployment), the preparation in
  # progress is cancelled and its job given back at once: the grace period leaves the time to do it before Docker kills it.
  worker:
    image: ghcr.io/${IMAGE_OWNER}/acrofunjam-worker:${IMAGE_TAG}
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 40s
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 64
    environment:
      ConnectionStrings__AcroFunJam: Host=postgres;Database=acrofunjam;Username=acrofunjam;Password=${POSTGRES_PASSWORD}
      PhotoStorage__ServiceUrl: ${PHOTO_STORAGE_URL}
      PhotoStorage__Bucket: ${PHOTO_STORAGE_BUCKET}
      PhotoStorage__AccessKey: ${PHOTO_STORAGE_ACCESS_KEY}
      PhotoStorage__SecretKey: ${PHOTO_STORAGE_SECRET_KEY}
      PhotoStorage__CreateBucket: "false"
      VideoProcessing__Threads: "2"
    volumes:
      - worker-files:/var/tmp/acrofunjam # originals fetched and prepared files, emptied at each start
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: ghcr.io/${IMAGE_OWNER}/acrofunjam-migrations:${IMAGE_TAG}
    logging: *logging
    profiles: [tools] # run by the deployment only, never by "up"
    environment:
      MIGRATIONS_CONNECTION: Host=postgres;Database=acrofunjam;Username=acrofunjam;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: acrofunjam
      POSTGRES_USER: acrofunjam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acrofunjam -d acrofunjam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  worker-files:
